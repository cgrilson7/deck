# tmux config for the deck server (socket -L deck / deck-dev).
# One tmux session per Claude Code session; exactly one client (the deck tile) attaches to each.
# Keep this minimal: the tile IS the terminal, tmux is only here so sessions survive the app quitting.

set -g status off
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g allow-passthrough on

# Forward the pane's title (Claude sets it) to the outer terminal, so xterm.js sees it.
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# When claude exits cleanly the session goes away and the slot frees.
# When it exits with an error the dead pane stays so the error is readable in the tile.
set -g remain-on-exit failed
set -g destroy-unattached off
set -g detach-on-destroy on

# The tile that is attached decides the size; there is never a second client.
set -g window-size latest
setw -g aggressive-resize on
